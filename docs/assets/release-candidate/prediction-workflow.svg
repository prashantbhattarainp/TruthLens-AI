<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="title description">
  <title id="title">TruthLens AI prediction workflow</title>
  <desc id="description">A synthetic article passes frontend validation, Node validation, private ML inference and optional explainability before a bounded research result is returned. The result is not a factual verdict or calibrated confidence.</desc>
  <style>
    .bg { fill: #f6f8fb; } .step { fill: #fff; stroke: #b7c5d4; stroke-width: 2; } .accent { fill: #dff4f3; stroke: #0b6374; } .xai { fill: #e7f1ff; stroke: #185ea8; } .warn { fill: #fff0e5; stroke: #d07638; } .title { font: 800 29px system-ui, sans-serif; fill: #102033; } .label { font: 800 17px system-ui, sans-serif; fill: #102033; } .copy { font: 14px system-ui, sans-serif; fill: #41536a; } .small { font: 700 12px system-ui, sans-serif; fill: #66778e; } .line { stroke: #0b6374; stroke-width: 4; fill: none; marker-end: url(#arrow); }
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b6374"/></marker></defs>
  <rect class="bg" width="1280" height="680" rx="32"/>
  <text class="title" x="72" y="84">Prediction workflow — bounded research signal</text>
  <text class="copy" x="72" y="116">The release candidate tests the existing path with synthetic text only; it does not retain user submissions.</text>
  <g transform="translate(72 220)"><rect class="step" width="190" height="150" rx="18"/><text class="label" x="24" y="48">1. Input</text><text class="copy" x="24" y="78">Headline + article</text><text class="small" x="24" y="108">Client validation</text></g>
  <g transform="translate(300 220)"><rect class="step accent" width="190" height="150" rx="18"/><text class="label" x="24" y="48">2. Node API</text><text class="copy" x="24" y="78">Schema + envelope</text><text class="small" x="24" y="108">Request ID / timeout</text></g>
  <g transform="translate(528 220)"><rect class="step" width="190" height="150" rx="18"/><text class="label" x="24" y="48">3. Inference</text><text class="copy" x="24" y="78">Integrity-checked</text><text class="small" x="24" y="108">TF-IDF + LinearSVC</text></g>
  <g transform="translate(756 220)"><rect class="step xai" width="190" height="150" rx="18"/><text class="label" x="24" y="48">4. XAI</text><text class="copy" x="24" y="78">Optional SHAP/LIME</text><text class="small" x="24" y="108">Margin behaviour only</text></g>
  <g transform="translate(984 220)"><rect class="step warn" width="190" height="150" rx="18"/><text class="label" x="24" y="48">5. Result</text><text class="copy" x="24" y="78">Research label</text><text class="small" x="24" y="108">Human review required</text></g>
  <path class="line" d="M262 295 H300"/><path class="line" d="M490 295 H528"/><path class="line" d="M718 295 H756"/><path class="line" d="M946 295 H984"/>
  <rect class="step warn" x="72" y="476" width="1102" height="106" rx="18"/>
  <text class="label" x="104" y="522">Interpretation boundary</text><text class="copy" x="360" y="522">Confidence remains unavailable. The decision score is an uncalibrated margin, XAI is model behaviour, and neither output is a factual verdict, source-credibility assessment, or production risk score.</text>
  <text class="small" x="104" y="552">Failure paths are deliberate: validation, timeout, unavailable ML service, invalid response, and 404/5xx states return safe API/UI feedback.</text>
</svg>
