  .axis { font: 13px Arial, Helvetica, sans-serif; fill: #1F2937; }
  .small { font: 12px Arial, Helvetica, sans-serif; fill: #6C757D; }
  .value { font: 13px Arial, Helvetica, sans-serif; fill: #1F2937; }
  .axis-line { stroke: #6C757D; stroke-width: 1.2; }
  .grid { stroke: #D9E1E8; stroke-width: 1; }
</style>
