<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Raw character-count distribution</title>
<desc id="chart-desc">Stored character counts, including original whitespace and punctuation. Each box spans the first to third quartile; the heavy line marks the median.</desc>
<rect width="1440" height="620" fill="#FFFFFF"/>

<style>
  .title { font: 600 28px Arial, Helvetica, sans-serif; fill: #1F2937; }
