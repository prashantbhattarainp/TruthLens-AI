<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Raw word-count distribution</title>
<desc id="chart-desc">No text preprocessing; boxes show quartiles and bold marks show medians. Each box spans the first to third quartile; the heavy line marks the median.</desc>
<rect width="1440" height="620" fill="#FFFFFF"/>

<style>
  .title { font: 600 28px Arial, Helvetica, sans-serif; fill: #1F2937; }
  .subtitle { font: 15px Arial, Helvetica, sans-serif; fill: #6C757D; }
  .axis { font: 13px Arial, Helvetica, sans-serif; fill: #1F2937; }
  .small { font: 12px Arial, Helvetica, sans-serif; fill: #6C757D; }
  .value { font: 13px Arial, Helvetica, sans-serif; fill: #1F2937; }
  .axis-line { stroke: #6C757D; stroke-width: 1.2; }
  .grid { stroke: #D9E1E8; stroke-width: 1; }
</style>
<text x="60.0" y="54.0" class="title" text-anchor="start">Raw word-count distribution</text>
<text x="60.0" y="82.0" class="subtitle" text-anchor="start">No text preprocessing; boxes show quartiles and bold marks show medians</text>
<line x1="270.0" y1="135" x2="270.0" y2="530" class="grid"/>
<text x="270.0" y="570.0" class="small" text-anchor="middle">1</text>
