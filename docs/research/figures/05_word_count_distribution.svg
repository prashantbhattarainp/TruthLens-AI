<line x1="1350.0" y1="135" x2="1350.0" y2="530" class="grid"/>
<text x="1350.0" y="570.0" class="small" text-anchor="middle">264</text>
<line x1="270" y1="530" x2="1350" y2="530" class="axis-line"/>
<text x="252.0" y="238.8" class="axis" text-anchor="end">News Body</text>
<line x1="270.0" y1="233.8" x2="1350.0" y2="233.8" stroke="#0072B2" stroke-width="3"/>
<line x1="270.0" y1="219.8" x2="270.0" y2="247.8" stroke="#0072B2" stroke-width="2"/>
<line x1="1350.0" y1="219.8" x2="1350.0" y2="247.8" stroke="#0072B2" stroke-width="2"/>
<rect x="915.4" y="207.8" width="303.2" height="52.0" fill="#0072B2" opacity="0.350"/>
