<text x="1362.0" y="238.8" class="value" text-anchor="start">median 62</text>
<text x="252.0" y="436.2" class="axis" text-anchor="end">Statement</text>
<line x1="404.3" y1="431.2" x2="1139.4" y2="431.2" stroke="#D55E00" stroke-width="3"/>
