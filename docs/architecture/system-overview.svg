<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">TruthLens AI system architecture</title>
  <desc id="desc">Browser application connects to a Node.js API, which connects to a private FastAPI ML service and returns a safe product response.</desc>
  <rect width="1200" height="380" fill="#f6f8fb"/>
  <text x="72" y="68" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#102a43">TruthLens AI service boundary</text>
  <g font-family="Arial, sans-serif">
    <rect x="60" y="130" width="235" height="150" rx="18" fill="#ffffff" stroke="#c9d6e2" stroke-width="2"/>
    <text x="90" y="180" font-size="22" font-weight="700" fill="#102a43">Browser SPA</text>
    <text x="90" y="216" font-size="16" fill="#486581">Accessible product UI</text>
    <text x="90" y="242" font-size="16" fill="#486581">No direct ML access</text>
    <rect x="482" y="130" width="235" height="150" rx="18" fill="#e9f5f3" stroke="#4c9d8d" stroke-width="2"/>
    <text x="512" y="180" font-size="22" font-weight="700" fill="#102a43">Node.js API</text>
    <text x="512" y="216" font-size="16" fill="#486581">Validation and envelopes</text>
    <text x="512" y="242" font-size="16" fill="#486581">Public boundary</text>
    <rect x="905" y="130" width="235" height="150" rx="18" fill="#ffffff" stroke="#c9d6e2" stroke-width="2"/>
    <text x="935" y="180" font-size="22" font-weight="700" fill="#102a43">FastAPI ML service</text>
    <text x="935" y="216" font-size="16" fill="#486581">Private network</text>
    <text x="935" y="242" font-size="16" fill="#486581">Classification and signals</text>
    <path d="M315 205 H455" stroke="#2f7f73" stroke-width="5" stroke-linecap="round"/><path d="M455 205 l-15 -10 v20z" fill="#2f7f73"/>
    <path d="M737 205 H878" stroke="#2f7f73" stroke-width="5" stroke-linecap="round"/><path d="M878 205 l-15 -10 v20z" fill="#2f7f73"/>
    <text x="416" y="318" font-size="15" fill="#486581">Validated request</text><text x="822" y="318" font-size="15" fill="#486581">Private call</text>
  </g>
</svg>
